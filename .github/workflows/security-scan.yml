name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  weekly-security:
    name: 🛡️ Weekly Security & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit tools
        run: |
          pip install --upgrade pip
          pip install safety bandit pip-audit

      - name: pip-audit (CVE check on requirements)
        run: pip-audit -r requirements.txt --format markdown

      - name: Safety check
        run: safety check -r requirements.txt --full-report

      - name: Bandit deep scan
        run: bandit -r app.py -f txt

      - name: Scan latest Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ramprice:latest
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: 0
